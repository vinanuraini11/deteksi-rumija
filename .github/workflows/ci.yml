name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1
          pip install -r requirements.txt
      - name: Cek kode aplikasi
        run: python -m py_compile app/app.py app/pengolahan.py
      - name: Cek modul pengolahan dan OCR
        run: cd app && python -c "import pengolahan as pc; assert pc.OCR_TERSEDIA, 'Tesseract tidak ditemukan'"
      - name: Cek model dapat dimuat
        run: python -c "from ultralytics import YOLO; YOLO('app/best.pt')"
